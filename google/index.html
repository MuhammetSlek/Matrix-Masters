<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
</head>
<body>
    <header id="header">
        <img id="logo" src="images/logo.png" alt="Google Logo">
    </header>
    <div class="search" id="search-background">
        <h5>Search the web using Google!</h5>
        <input id="input" type="text">
        <div class="button-group">
            <button id="google-search">Google Search</button>
            <button id="feeling-lucky">I'm Feeling Lucky</button>
        </div>
    </div>
    <footer>
    <div class="footer-row">
        <div id="special">
            <h5>Special Searches</h5>
            <a href="#">Stanford Search</a>
            <a href="#">Linux Search</a>
        </div>
        <div id="links">
            <a href="#">Help!</a>
            <a href="#">About Google!</a>
            <a href="#">Company Info</a>
            <a href="#">Google Logos</a>
        </div>
        <div id="subscription">
            <h5>Get Google!</h5>
            <h5>updates monthly</h5>
            <input id="email-input" type="email" placeholder="your email">
            <div id="kapsayici">
                <button>Subscribe</button>
                <a href="#">Arcive</a>
            </div>
        </div>
    </div>
    <h5 id="copyright">Copyright ©1998 Google Inc.</h5>
</footer>
    

</body>
</html>
