<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Matrix Masters Twitter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="background">
          <div id="white-background">
            <div id="first-row"> <!-- the twitter logo and the cross button -->
                <img id="cross" src="images/cross.png" alt="cross button">
                <img id="twitter" src="images/twitter.png" alt="Twitter Logo">
            </div>
            <div id="rest"> <!-- here is the sign in options like google apple accounts beside e-mail login -->
                <h2>Sign in to Twitter</h2>


                <div class='google'> 
                    <button class='button' id="google">
                        <img id="google-logo" src="images/google.png" alt="Google Logo">
                        Sign in with Google
                    </button>
                </div>

                <div class='apple'>
                    <button class='button' id="apple">
                        <img id="apple-logo" src="images/apple.png" alt="Apple Logo">
                        Sign in with Apple
                    </button>
                </div>
                


                <div id="or">
                    <hr>
                    <h5>or</h5>
                    <hr>
                </div>
                <div id="email login">
                    <input type="text" placeholder="Phone, email, or username">
                </div>
                <div id="actions"> <!-- we will have here the next and forgot password buttons -->
                     <button class='button' id="next2">Next</button>
                    <button class='button'   id="forgot">Forgot password?</button>  
                </div>
            </div>

            <div id="sign up"> <!-- we will have here the sign up button -->
                    <h5>Don't have an account?</h5>
                    <a href="#" id="sign up">Sign up</a>
            </div>
            
          </div>
        </div>
    </body>
</html>
